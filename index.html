<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to MakeCode</title>
    <script type="module" src="index.js"></script>
    <link rel="stylesheet" href="styles.css"
</head>
<body>
    <div class="instructions section">
        <ol>
            <li>Select image</li>
            <li>Press the copy button</li>
            <li>Open a blank image in MakeCode Arcade with the correct size</li>
            <li>Paste the image</li>
        </ol>
    </div>

    <div class="selectImage section">
        <input type="file" id="imageInput" accept="image/*" />
    </div>
    
    <div class="selectColor section">
        <p>
            Palette: <select id="colormapSelect"></select>
        </p>
        <details>
            <summary>custom palette</summary>
            <textarea id="colorInput" rows="10" cols="50" placeholder="Enter color data..."></textarea>
        </details>
        <p>
            Check for transparency? <input type="checkbox" checked="true" id="checkTransparency">
        </p>
        <p>
            conversion method:
            <select id="conversionMethodSelect">
                <option value="pythagorean">Pythagorean</option>
                <option value="ciede2000">Ciede2000</option>
                <option value="hyab">HyAb</option>
            </select>
        </p>
    </div>
    
    
    
    <div class="selectSize section">
        <p>
            <label>Width:</label>
            <input type="number" id="widthInput" value="16">
            <label>Height:</label>
            <input type="number" id="heightInput" value="16">
        </p>
    </div>

    <div class="output section">
        <textarea readonly id="output"></textarea>
        <button id="copyToClipboard">Copy</button>
        <img id="outputImg" width="360">
    </div>

</body>
</html>
